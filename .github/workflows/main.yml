name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version (e.g., v1.0.0)"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller main.py --add-data assets:assets --add-data levels:levels

      - name: List files
        run: ls -R

      - name: Rename executable
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/main/main.exe dist/mazetest2-win.exe
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/main dist/mazetest2-linux
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/main dist/mazetest2-mac
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mazetest2-${{ matrix.os }}
          path: dist/*
